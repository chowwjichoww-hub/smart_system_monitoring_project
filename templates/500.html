{% extends 'base.html' %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 2rem;">
    <i class="fas fa-server" style="font-size: 5rem; color: #ff6b6b; margin-bottom: 1rem;"></i>
    <h1 style="color: #1a237e; margin-bottom: 1rem;">500 - Server Error</h1>
    <p style="color: #666; margin-bottom: 2rem;">Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
</div>
{% endblock %}
