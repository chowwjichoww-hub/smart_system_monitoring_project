{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 2rem;">
    <i class="fas fa-exclamation-circle" style="font-size: 5rem; color: #ff6b6b; margin-bottom: 1rem;"></i>
    <h1 style="color: #1a237e; margin-bottom: 1rem;">404 - Page Not Found</h1>
    <p style="color: #666; margin-bottom: 2rem;">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
</div>
{% endblock %}
